name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @roof-estimator/core build
      - run: pnpm --filter @roof-estimator/geo build
      - run: pnpm --filter @roof-estimator/widget build
      - run: pnpm --filter @roof-estimator/web build
        env:
          VITE_BASE: /roof-estimator/
          VITE_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
      # Host the embeddable component next to the app: /roof-estimator/widget/roof-quote.js
      - run: mkdir -p apps/web/dist/widget && cp packages/widget/dist/*.js packages/widget/dist/*.css apps/web/dist/widget/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
